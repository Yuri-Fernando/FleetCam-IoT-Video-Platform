services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fleetcam
      POSTGRES_USER: fleetcam
      POSTGRES_PASSWORD: fleetcam_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetcam"]
      interval: 5s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  objectstore:
    build:
      context: .
      dockerfile: config/Dockerfile.objectstore
    command: server -dir=/data -ip=objectstore -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/etc/seaweed/s3.json
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - objectstore_data:/data
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleetcam
      SPRING_DATASOURCE_USERNAME: fleetcam
      SPRING_DATASOURCE_PASSWORD: fleetcam_local
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLEETCAM_API_KEY: ${FLEETCAM_API_KEY:-local-demo-key}
      FLEETCAM_TENANT_B_API_KEY: ${FLEETCAM_TENANT_B_API_KEY:-local-tenant-b-key}
      FLEETCAM_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      FLEETCAM_S3_ENDPOINT: http://objectstore:9000
      FLEETCAM_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      FLEETCAM_S3_ACCESS_KEY: fleetcam_local
      FLEETCAM_S3_SECRET_KEY: fleetcam_local_password
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
  console:
    build: ./frontend
    ports: ["127.0.0.1:8081:80"]
    depends_on: [api]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    build:
      context: ./observability
      dockerfile: Dockerfile.prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    build:
      context: ./observability
      dockerfile: Dockerfile.grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fleetcam_local
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
volumes:
  postgres_data:
  objectstore_data:

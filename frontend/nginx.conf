server {
    listen 80;
    root /usr/share/nginx/html;
    # Docker's embedded DNS, re-resolved per request: a recreated api container gets a new IP,
    # and a static upstream would keep returning 502 until the console restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ { set $api_upstream http://api:8080; proxy_pass $api_upstream; }
    location / { try_files $uri $uri/ /index.html; }
}
